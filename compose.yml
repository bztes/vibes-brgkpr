services:
  brgkpr:
    image: ghcr.io/bztes/vibes-brgkpr:latest
    container_name: brgkpr
    restart: unless-stopped
    ports:
      - '3000:3000' # web interface and restic REST server under /restic/ (put a reverse proxy with TLS in front of it)
      - '2222:22' # SSH for borg / Pika Backup
    environment:
      - ORIGIN
      - ADDRESS_HEADER
      - PUID
      - PGID
      - TZ
    volumes:
      - ${DATA_DIR:-./data}:/data # database, SSH host keys, authorized_keys
      - ${REPO_DIR:-./data/repos}:/repos # repository storage
